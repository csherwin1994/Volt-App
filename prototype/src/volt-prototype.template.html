/*__ENGINE__*/
const motionCache = {};
const motionFor = name => (name in motionCache ? motionCache[name] : (motionCache[name] = VoltMotion.resolve(MOTION, name)));
// Running animations keyed by slot; their clock survives re-renders so the figure never restarts mid-rep.
const ANIMS = {};
function mountAnim(slot, node, name, opts = {}) {
  const pat = motionFor(name); if (!pat || !node) return null;
  const prev = ANIMS[slot];
  const keep = prev && prev.name === name ? { start: prev.ctl.time, autoplay: prev.ctl.playing, speed: prev.ctl.speed } : {};
  if (prev) prev.ctl.destroy();
  const ctl = VoltMotion.mount(node, pat, { ...opts, ...keep });
  ANIMS[slot] = { ctl, name };
  return ctl;
}
function dropAnims(prefix) { for (const k of Object.keys(ANIMS)) if (k.startsWith(prefix)) { ANIMS[k].ctl.destroy(); delete ANIMS[k]; } }
function mountThumbs(root) {
  (root || document).querySelectorAll('[data-thumb]').forEach(n => {
    if (n.firstChild) return;
    const pat = motionFor(n.dataset.thumb); if (!pat) return;
    const c = VoltMotion.mount(n, pat, { autoplay: false, stroke: 0.022 });
    c.seek(c.firstMoveFraction);

function seed() {
  const exercises = LIB.map(([name, muscle, equip]) => ({ id: uid(), name, muscle, equip, custom: false }));
  const mOf = n => (LIB.find(e => e[0] === n) || [, 'Other'])[1];
  const routines = Object.entries(PLANS).map(([name, items]) => ({
    id: uid(), name, lastUsed: null,
    items: items.map(([ex, w, r]) => ({ ex, muscle: mOf(ex), sets: 3, reps: r, weight: w }))
  }));
  const history = [];
  const order = ['Push Day', 'Pull Day', 'Leg Day'];
  const today = startOfDay(Date.now());
  let k = 0; const occ = { 'Push Day': 0, 'Pull Day': 0, 'Leg Day': 0 };
  for (let d = 38; d >= 1; d--) {
    const day = new Date(today - d * DAY);
    if (![1, 3, 5].includes(day.getDay())) continue;
    k++;
    if (k === 5 || k === 11) continue;
    const name = order[k % 3]; const n = occ[name]++;
    const start = new Date(day.getTime() + (17.5 + (k % 3) * 0.5) * 3600e3);
    const mins = 46 + ((k * 7) % 19);
    history.push({ id: uid(), title: name, start: start.getTime(), end: start.getTime() + mins * 60e3,
      logs: PLANS[name].map(([ex, w, r]) => ({ ex, muscle: mOf(ex),
        sets: [0, 1, 2].map(() => ({ w: +(w + n * (w >= 50 ? 2.5 : 1)).toFixed(1), r, done: true })) })) });
    routines.find(r => r.name === name).lastUsed = start.getTime();
  }
  routines.forEach(rt => {
    const last = history.filter(h => h.title === rt.name).at(-1);
    if (last) rt.items.forEach(it => { const lg = last.logs.find(l => l.ex === it.ex); if (lg) it.weight = lg.sets[0].w; });
  });
  return { v: 2, name: 'Connor', unit: 'kg', appearance: 'auto', stage: 'login', seenWelcome: false, exercises, routines, history: history.reverse(), active: null, sample: true };
}

const LB = 2.20462;

// ---------- Recommendation (same rules as the app's engine, simplified) ----------
function lastSets(ex) { const h = S.history.find(h => h.logs.some(l => l.ex === ex && l.sets.length)); return h ? h.logs.find(l => l.ex === ex).sets : null; }
function isCompound(name) { const d = EXDATA[name]; if (d?.mech) return d.mech === 'compound'; return /Press|Squat|Deadlift|Row|Pull Up|Dip|Lunge|Thrust|Clean|Swing|Thruster/.test(name); }
function target(name, sets = 3, reps) {
  const comp = isCompound(name); reps = reps || (comp ? 6 : 10);
  const top = comp ? Math.max(reps, 6) : Math.max(reps, 10), floor = comp ? Math.max(3, top - 2) : Math.max(5, top - 3);
  const inc = comp ? 2.5 : 1.25;
  const last = lastSets(name);
  if (!last) return { sets, reps, weight: null, delta: null, note: `Pick a weight you could lift for ${reps + 2} reps.` };
  const w = Math.max(...last.map(s => s.w)); const minR = Math.min(...last.filter(s => s.w === w).map(s => s.r));
  if (minR >= top) return { sets: Math.max(sets, last.length), reps: floor, weight: w + inc, delta: inc, note: `Up ${inc} kg: you hit ${top} reps on every set last time. Aim for ${floor}, then build back to ${top}.` };
  const r = Math.min(top, Math.max(floor, minR + 1));
  return { sets: Math.max(sets, last.length), reps: r, weight: w, delta: 0, note: `Same weight, aim for ${r} reps (last time ${minR}).` };
}
function recommend() {
  const H = S.history;
  if (!H.length) return { title: S.routines[0]?.name || 'Full Body', reason: 'Start with a routine. Suggestions improve with every workout you log.', routine: S.routines[0] || null };
  const last = {};
  H.forEach(h => h.logs.forEach(l => { last[l.muscle] = Math.max(last[l.muscle] || 0, h.start); }));
  const days = g => last[g] ? (Date.now() - last[g]) / DAY : 99;
  let best = null;
  S.routines.forEach(rt => {
    const gs = [...new Set(rt.items.map(i => i.muscle))].filter(g => g !== 'Cardio');
    if (!gs.length || Math.min(...gs.map(days)) < 2) return;
    const score = gs.reduce((a, g) => a + Math.min(days(g), 10), 0) / gs.length - (H[0].title === rt.name ? 5 : 0);
    if (!best || score > best.score) best = { rt, score, gs };
  });
  if (!best) return { title: 'Recovery Day', reason: 'Everything was trained in the last two days. Rest, walk or stretch today.', routine: null };
  const lead = best.gs.slice(0, 2).map(g => g.toLowerCase()).join(' and ');
  const d = Math.floor(Math.min(...best.gs.map(days)));
  const lastDay = d >= 99 ? null : fmtDate(Date.now() - d * DAY, { weekday: 'long' });
  return { title: best.rt.name, reason: lastDay ? `${lead[0].toUpperCase() + lead.slice(1)} ${best.gs.length > 1 ? 'are' : 'is'} recovered since ${lastDay}.` : `You haven't trained ${lead} yet.`, routine: best.rt };
}

function finishWorkout() {

function isPR(ex, w, r, excludeId) {
  const earlier = S.history.filter(h => h.id !== excludeId).flatMap(h => h.logs.filter(l => l.ex === ex).flatMap(l => l.sets));

  return w > Math.max(...earlier.map(s => s.w)) || e1(w, r) > Math.max(...earlier.map(s => e1(s.w, s.r))) + 0.01;
}

  const logged = [...new Set(S.history.flatMap(h => h.logs.map(l => l.ex)))].sort();
  if (!U.trendEx || !logged.includes(U.trendEx)) U.trendEx = logged.includes('Bench Press') ? 'Bench Press' : logged[0];
  const weeks = Array.from({ length: 8 }, (_, i) => mon - (7 - i) * 7 * DAY);
  const vols = weeks.map(w => toDisp(S.history.filter(h => h.start >= w && h.start < w + 7 * DAY).reduce((a, h) => a + volOf(h), 0)));
  const max = Math.max(...vols, 1);
  const today = startOfDay(Date.now()).getTime(), from = mon - 28 * DAY;
  const cells = Array.from({ length: 35 }, (_, i) => { const d = from + i * DAY; const on = S.history.some(h => sameDay(h.start, d));
    return `<button data-act="day" data-d="${d}" aria-label="${fmtDate(d, { weekday: 'long', day: 'numeric', month: 'long' })}, ${on ? 'trained' : 'rest'}" style="height:30px;background:${d > today ? 'transparent' : on ? 'var(--accent)' : 'var(--fill)'};box-shadow:${d === today ? 'inset 0 0 0 1px var(--label)' : d > today ? 'inset 0 0 0 1px var(--line)' : 'none'}"></button>`; }).join('');
  return `<div class="stack" style="gap:40px"><header class="sec" style="gap:10px"><span class="lbl" style="font-weight:400">Last 8 weeks</span><h1>Progress</h1></header>
    <div class="grid g3"><div><span class="k">This week</span><span class="val">${thisWeek.length}<span class="u">OF 3</span></span></div><div><span class="k">Lifted</span><span class="val">${fmtVol(thisWeek.reduce((a, h) => a + volOf(h), 0))}<span class="u">${unitU()}</span></span></div><div><span class="k">Streak</span><span class="val">${streak()}<span class="u">WK</span></span></div></div>
    <section class="sec" style="gap:14px"><div class="row-between"><span class="lbl">Weekly volume · ${unitU()}</span><span class="lbl" style="color:var(--accent-text)">This week ${fmtVol(fromDisp(vols[7]))}</span></div>
      <div style="height:150px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;border-bottom:1px solid var(--label)">${vols.map((v, i) => `<div title="${Math.round(v)} ${S.unit}" style="height:${Math.max(v ? 2 : 0, Math.round(v / max * 140))}px;background:${i === 7 ? 'var(--accent)' : 'var(--bar)'}"></div>`).join('')}</div>
      <div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px" class="mono">${weeks.map((w, i) => `<span style="font-size:10px;color:var(--ink-3)">${i === 7 ? 'NOW' : fmtDate(w, { day: 'numeric' })}</span>`).join('')}</div></section>
    <section class="sec" style="gap:14px"><div class="row-between"><span class="lbl">Training days · 5 weeks</span><span class="lbl">${S.history.filter(h => h.start >= from).length} workouts</span></div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">${cells}</div></section>
    ${U.trendEx ? strengthBlock(U.trendEx, logged) : ''}
  </div>`;
}
function topsFor(ex) {
  return S.history.slice().reverse().map(h => { const l = h.logs.find(l => l.ex === ex); return l && l.sets.length ? { t: h.start, w: Math.max(...l.sets.map(s => s.w)) } : null; }).filter(Boolean);
}
function strengthBlock(ex, logged) {
  const pts = topsFor(ex);
  const best = Math.max(0, ...pts.map(p => p.w));
  const gain = pts.length > 1 ? pts.at(-1).w - pts[0].w : 0;
  let chart = '';
  if (pts.length > 1) {
    const W = 350, H = 110, lo = Math.min(...pts.map(p => p.w)) * 0.95, hi = best * 1.02;
    const x = i => W * i / (pts.length - 1), y = v => 100 - 90 * (v - lo) / (hi - lo || 1);
    const line = pts.map((p, i) => `${x(i)},${y(p.w)}`).join(' ');
    chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heaviest ${esc(ex)} set per workout"><line x1="0" y1="10" x2="${W}" y2="10" stroke="var(--line)"/><line x1="0" y1="55" x2="${W}" y2="55" stroke="var(--line)"/><line x1="0" y1="100" x2="${W}" y2="100" stroke="var(--label)"/>
      <polygon points="0,100 ${line} ${W},100" fill="var(--accent-soft)"/><polyline points="${line}" fill="none" stroke="var(--accent-text)" stroke-width="1.5"/><rect x="${W - 6}" y="${y(pts.at(-1).w) - 6}" width="12" height="12" fill="var(--accent)"/></svg>`;
  }
  return `<section class="sec" style="gap:14px"><div class="row-between"><span class="lbl">Strength</span>
    <span class="sel-wrap"><select class="sel" data-change="trend" aria-label="Exercise">${logged.map(e => `<option ${e === ex ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>${ic('down', 14)}</span></div>
    <button data-act="open-ex" data-name="${esc(ex)}" style="display:flex;align-items:baseline;gap:6px;text-align:left"><span style="font-size:56px;line-height:48px;letter-spacing:-2.4px">${fmtW(best)}</span><span class="cap">${unitU()}${gain ? ` · +${toDisp(gain)} since ${fmtDate(pts[0].t, { day: 'numeric', month: 'short' })}` : ''}</span></button>
    ${chart || '<p class="lead">Log this exercise twice to see a trend.</p>'}</section>`;
}

function filterEx(q, m) { q = q.trim().toLowerCase(); return S.exercises.filter(e => (!m || e.muscle === m) && (!q || e.name.toLowerCase().includes(q) || details(e.name, e.muscle).primary.some(x => x.includes(q)))).sort((a, b) => a.name.localeCompare(b.name)); }
function exRows(list, act) {
  if (!list.length) return `<div class="empty"><b>No exercises found.</b><span class="lead">Try another word or muscle group.</span></div>`;

}
const chipRow = (sel, act) => `<div class="chips">${[null, ...MUSCLES].map(m => `<button class="chip ${sel === m ? 'on' : ''}" data-act="${act}" data-m="${m || ''}">${m || 'All'}</button>`).join('')}</div>`;

function bodySvg(regions, p, s, label) {
  return `<svg viewBox="0 0 120 232" role="img" aria-label="${label}">${regions.map(([x, y, w, h, r, m]) => {
    const st = m.some(v => p.includes(v)) ? 'fill:var(--accent)' : m.some(v => s.includes(v)) ? 'fill:var(--accent-soft);stroke:var(--accent-text);stroke-width:.6' : 'fill:var(--fill)';
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" style="${st}"/>`; }).join('')}</svg>`;
}
function platesFor(total) {
  const bar = S.unit === 'lb' ? fromDisp(45) : 20;
  const sizes = S.unit === 'lb' ? [45, 35, 25, 10, 5, 2.5].map(fromDisp) : [25, 20, 15, 10, 5, 2.5, 1.25];
  let side = Math.max(0, (total - bar) / 2); const out = [];
  for (const sz of sizes) while (side >= sz - 0.01) { side -= sz; out.push(sz); }
  return { bar, out, sizes };
}

function renderExercise() {
  const el = $('exercise'), X = U.exercise;
  if (!X) { el.innerHTML = ''; dropAnims('ex'); return; }

  const d = details(ex.name, ex.muscle);

  if (X.weight == null) X.weight = t.weight;

  const tops = topsFor(ex.name);
  const all = S.history.flatMap(h => h.logs.filter(l => l.ex === ex.name).flatMap(l => l.sets));
  const heaviest = all.reduce((b, s) => !b || s.w > b.w ? s : b, null);
  const e1 = Math.max(0, ...all.map(s => s.r === 1 ? s.w : s.w * (1 + s.r / 30)));
  const pl = X.weight ? platesFor(X.weight) : null;
  const fresh = !el.firstChild;

  el.innerHTML = `<div class="layer ${fresh ? 'slide-in' : ''}" style="z-index:12">

    <div class="scroll"><div style="display:flex;flex-direction:column;gap:44px;padding:12px 20px 48px">
      <section class="sec" style="gap:14px"><h1>${esc(ex.name)}</h1><div class="tags"><span class="tag"><i></i>${d.primary[0] || ex.muscle}</span><span class="tag">${ex.equip}</span>${d.mechanic ? `<span class="tag">${d.mechanic}</span>` : ''}${d.level ? `<span class="tag">${d.level}</span>` : ''}</div></section>
      ${mo ? `<section aria-label="Movement demo"><div class="demo"><div class="ma" id="ex-anim"></div><span class="fr" data-rep>Rep 1</span></div>
        <div class="demo-bar"><button data-act="demo-play" aria-label="Pause demo">${PAUSE_ICON}</button><span style="flex:1" data-phase></span><span style="opacity:.65">${VoltMotion.timeline(mo).total.toFixed(1)} s / rep</span></div>
        <div class="seg demo-pos"><button class="${(X.speed || 1) === 0.5 ? 'on' : ''}" data-act="demo-speed" data-k="0.5">Slow · 0.5×</button><button class="${(X.speed || 1) === 1 ? 'on' : ''}" data-act="demo-speed" data-k="1">Normal · 1×</button></div></section>` : ''}
      <section class="sec" style="gap:16px"><span class="lbl">Today's target · ${t.sets} × ${t.reps}</span>
        <div class="row-between" style="align-items:flex-end"><span style="display:flex;align-items:baseline;gap:6px"><span class="hero">${X.weight ? fmtW(X.weight) : '—'}</span><span class="cap" style="font-size:13px">${unitU()}</span></span>
          ${X.weight ? `<span style="display:flex;gap:6px;padding-bottom:4px"><button class="tbtn" data-act="w-minus">−${S.unit === 'lb' ? 5 : 2.5}</button><button class="tbtn" data-act="w-plus">+${S.unit === 'lb' ? 5 : 2.5}</button></span>` : `<button class="tbtn" data-act="w-set">Set weight</button>`}</div>
        <p class="lead">${esc(t.note)}</p>
        ${pl && ex.equip === 'Barbell' ? `<div class="plates" aria-label="Plates on each side"><span style="width:70px;height:6px;background:var(--ink-2)"></span><span style="width:10px;height:12px;background:var(--label)"></span>${pl.out.map(p => `<span style="width:${Math.max(5, 16 * p / pl.sizes[0] + 2)}px;height:${28 + 64 * p / pl.sizes[0]}px;background:${p === pl.sizes.at(-1) ? 'var(--accent)' : 'var(--ink)'}"></span>`).join('')}<span style="width:34px;height:6px;background:var(--ink-2)"></span></div>
          <span class="cap">Each side: ${pl.out.length ? pl.out.map(p => Math.round((S.unit === 'lb' ? p * LB : p) * 100) / 100).join(' + ') : 'empty bar'} · bar ${toDisp(pl.bar)} ${unitU()}</span>` : ''}</section>
      <section class="sec" style="gap:14px"><span class="lbl">Muscles worked</span>
        <div class="body"><div>${bodySvg(FRONT, d.primary, d.secondary, 'Front view')}<span class="cap" style="font-size:10px">Front</span></div><div>${bodySvg(BACK, d.primary, d.secondary, 'Back view')}<span class="cap" style="font-size:10px">Back</span></div></div>
        <div class="tags"><span class="tag"><i></i>Primary · ${d.primary.join(', ')}</span>${d.secondary.length ? `<span class="tag"><i style="background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-text)"></i>Secondary · ${d.secondary.slice(0, 3).join(', ')}</span>` : ''}</div></section>

      <section class="sec"><span class="lbl">Your records</span>
        ${heaviest ? `<div class="grid g3"><div><span class="k">Heaviest</span><span class="val">${fmtW(heaviest.w)}<span class="u">× ${heaviest.r}</span></span></div><div><span class="k">Est. 1RM</span><span class="val">${Math.round(toDisp(e1))}<span class="u">${unitU()}</span></span></div><div><span class="k">Logged</span><span class="val">${tops.length}<span class="u">×</span></span></div></div>
          ${tops.length > 1 ? `<div class="hist">${tops.slice(-8).map((p, i, arr) => { const lo = Math.min(...arr.map(a => a.w)) * 0.9, hi = Math.max(...arr.map(a => a.w)); return `<span style="height:${Math.max(4, 88 * (p.w - lo) / (hi - lo || 1))}px;background:${i === arr.length - 1 ? 'var(--accent)' : 'var(--bar)'}"></span>`; }).join('')}</div>` : ''}`
          : '<p class="lead">Log this exercise in a workout to start tracking records.</p>'}</section>
      ${S.active ? `<button class="btn primary" data-act="ex-add" data-name="${esc(ex.name)}">Add to ${esc(S.active.title)} ${ic('arrow')}</button>` : `<button class="btn primary" data-act="ex-start" data-name="${esc(ex.name)}">Start a Workout With This ${ic('arrow')}</button>`}
    </div></div></div>`;
  el.querySelector('.scroll').scrollTop = scroll;

    const ctl = mountAnim('ex', $('ex-anim'), ex.name, {

    if (b && ctl && !ctl.playing) { b.innerHTML = PLAY_ICON; b.setAttribute('aria-label', 'Play demo'); }
  } else dropAnims('ex');
}

function openExercise(name) { dropAnims('ex'); U.exercise = { name, speed: 1, weight: null, step: 0 }; $('exercise').innerHTML = ''; renderExercise(); }

function renderWorkout() {
  const el = $('workout');
  if (!S.active || !U.workoutOpen) { el.innerHTML = ''; dropAnims('w:'); return; }
  const a = S.active;
  const total = a.logs.reduce((n, l) => n + l.sets.length, 0);
  const done = a.logs.reduce((n, l) => n + l.sets.filter(s => s.done).length, 0);
  const vol = a.logs.reduce((n, l) => n + l.sets.filter(s => s.done).reduce((b, s) => b + s.w * s.r, 0), 0);
  const scroll = el.querySelector('.scroll')?.scrollTop || 0;
  const fresh = !el.firstChild;
  el.innerHTML = `<div class="layer ${fresh ? 'slide-up' : ''}">
    <div class="statusbar" aria-hidden="true"><span></span><span class="notch"></span><span></span></div>
    <div class="w-top"><button class="icon-btn" data-act="minimize" aria-label="Minimise workout">${ic('down', 20)}</button>
      <span class="w-live"><span style="width:7px;height:7px;background:var(--accent);flex:none"></span><input id="w-title" data-input="w-title" value="${esc(a.title)}" aria-label="Workout name"></span>
      <button class="icon-btn" data-act="discard" aria-label="Cancel workout" title="Cancel workout">${ic('x', 20)}</button><button class="btn gold sm" data-act="finish">Finish ${ic('arrow', 14)}</button></div>
    <div class="w-clock"><span class="hero" data-timer>${fmtDur((Date.now() - a.start) / 1000)}</span><span class="w-meta cap"><span>${done} / ${total} sets</span><span>${fmtVol(vol)} ${unitU()}</span></span></div>
    <div class="w-progress"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div>
    <div class="scroll"><div class="w-body">

// ---------- Events ----------
$('device').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id, li = +t.dataset.li, si = +t.dataset.si, a = S.active;
  switch (act) {
    case 'gate-mode': U.gate.mode = t.dataset.k; U.gate.err = ''; renderGate(); break;
    case 'gate-go': if (gateValid()) afterGate(); break;
    case 'gate-skip': afterGate(); break;
    case 'gate-social': toast('Not available in the prototype'); break;
    case 'welcome-go': S.seenWelcome = true; S.stage = 'app'; save(); render(); break;
    case 'show-login': S.stage = 'login'; S.seenWelcome = false; U.workoutOpen = false; U.exercise = null; save(); render(); break;
    case 'demo-toggle': { const n = t.dataset.name; U.demos[n] = !U.demos[n]; renderWorkout(); break; }
    case 'day': U.sheet = { type: 'day', d: +t.dataset.d }; renderSheet(); break;
    case 'tab': U.tab = t.dataset.k; U.exercise = null; render(); $('screen').scrollTop = 0; break;
    case 'appearance': S.appearance = t.dataset.k; save(); render(); break;
    case 'start': startWorkout(null); break;
    case 'start-planned': { const rt = S.routines.find(r => r.id === id); U.sheet = null; startWorkout(rt, true); break; }
    case 'start-routine': { const rt = S.routines.find(r => r.id === id); U.sheet = null; if (S.active) { U.workoutOpen = true; render(); toast('Finish your current workout first'); } else startWorkout(rt, true); break; }
    case 'open-workout': U.workoutOpen = true; U.exercise = null; render(); break;
    case 'minimize': U.workoutOpen = false; U.menu = null; render(); break;
    case 'open-ex': U.sheet = null; renderSheet(); openExercise(t.dataset.name); break;
    case 'close-ex': U.exercise = null; renderExercise(); break;
    case 'demo-play': { const a = ANIMS.ex; if (!a) break; if (a.ctl.playing) { a.ctl.pause(); t.innerHTML = PLAY_ICON; t.setAttribute('aria-label', 'Play demo'); } else { a.ctl.play(); t.innerHTML = PAUSE_ICON; t.setAttribute('aria-label', 'Pause demo'); } break; }
    case 'demo-speed': { U.exercise.speed = +t.dataset.k; if (ANIMS.ex) ANIMS.ex.ctl.setSpeed(U.exercise.speed); t.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === t)); break; }
    case 'w-minus': U.exercise.weight = Math.max(0, U.exercise.weight - step()); renderExercise(); break;
    case 'w-plus': U.exercise.weight = U.exercise.weight + step(); renderExercise(); break;
    case 'w-set': U.exercise.weight = 20; renderExercise(); break;
    case 'ex-step': U.exercise.step = +t.dataset.k; renderExercise(); break;
    case 'ex-prev': U.exercise.step = Math.max(0, U.exercise.step - 1); renderExercise(); break;
    case 'ex-next': U.exercise.step = Math.min(details(U.exercise.name).steps.length - 1, U.exercise.step + 1); renderExercise(); break;
    case 'ex-add': case 'ex-start': {
      const name = t.dataset.name, ex = S.exercises.find(x => x.name === name), tg = target(name), w = U.exercise?.weight ?? tg.weight ?? 0;
      if (!S.active) startWorkout(null);
      S.active.logs.push({ ex: name, muscle: ex?.muscle || 'Full Body', sets: Array.from({ length: tg.sets }, () => ({ w, r: tg.reps, done: false })) });
      U.sheet = null; U.exercise = null; U.workoutOpen = true; save(); render(); toast(`Added ${name}`); break; }
    case 'finish': {
      const done = a.logs.reduce((n, l) => n + l.sets.filter(s => s.done).length, 0);
      if (!done) { confirmDlg('No sets completed', 'Tick off at least one set before finishing, or cancel this workout.', 'OK', false, () => {}); break; }
      confirmDlg('Finish workout?', `Save ${done} completed ${done === 1 ? 'set' : 'sets'} to your history. Unticked sets are left out.`, 'Finish', false, finishWorkout); break; }
    case 'discard': U.dialog = { title: 'Cancel this workout?', msg: 'Nothing from it will be saved. Your history stays as it is.', ok: 'Cancel Workout', no: 'Keep Training', danger: true, fn: discardWorkout }; renderDialog(); break;
    case 'toggle-set': {
      const l = a.logs[li], s = l.sets[si]; s.done = !s.done;
      if (s.done) {
        s.pr = isPR(l.ex, s.w, s.r, a.id) && !l.sets.some((o, k) => k !== si && o.done && o.w >= s.w && o.r >= s.r);
        U.rest = { total: 90, ends: Date.now() + 90e3 };
        if (s.pr) { U.banner = `New PR · ${l.ex} ${fmtW(s.w)} ${unitU()} × ${s.r}`; setTimeout(() => { U.banner = null; renderWorkout(); }, 3000); }
      } else s.pr = false;
      save(); renderWorkout(); break; }
    case 'add-set': { const l = a.logs[li], last = l.sets.at(-1); l.sets.push({ w: last?.w || 0, r: last?.r || 0, done: false }); save(); renderWorkout(); break; }
    case 'remove-set': { const l = a.logs[li]; if (l.sets.length > 1) { l.sets.splice(si, 1); save(); renderWorkout(); } else toast('Remove the exercise to delete its last set'); break; }
    case 'ex-menu': U.menu = li >= 0 && U.menu !== li ? li : null; renderWorkout(); break;
    case 'remove-ex': a.logs.splice(li, 1); U.menu = null; save(); renderWorkout(); break;
    case 'add-ex': openPicker('workout'); break;
    case 'rest-add': U.rest.ends += +t.dataset.k * 1000; U.rest.total = Math.max(U.rest.total + +t.dataset.k, 1); if (U.rest.ends <= Date.now()) U.rest = null; renderWorkout(); break;
    case 'rest-skip': U.rest = null; renderWorkout(); break;
    case 'pick': {
      const ex = S.exercises.find(x => x.id === id), s = U.sheet, tg = target(ex.name);
      if (s.target === 'workout') { a.logs.push({ ex: ex.name, muscle: ex.muscle, sets: Array.from({ length: tg.sets }, () => ({ w: tg.weight || 0, r: tg.reps, done: false })) }); U.sheet = null; save(); render(); setTimeout(() => { const b = $('workout').querySelector('.scroll'); if (b) b.scrollTop = b.scrollHeight; }, 0); }
      else { const rt = S.routines.find(r => r.id === s.target); rt.items.push({ ex: ex.name, muscle: ex.muscle, sets: tg.sets, reps: tg.reps, weight: tg.weight || 0 }); U.sheet = { type: 'routine', id: rt.id }; save(); render(); toast(`Added ${ex.name}`); }

    case 'close-sheet': U.sheet = null; renderSheet(); break;
    case 'close-sheet-bg': if (e.target === t) { U.sheet = null; renderSheet(); } break;
    case 'detail': U.sheet = { type: 'detail', id }; renderSheet(); break;
    case 'delete-workout': confirmDlg('Delete workout?', 'It will be removed from your history and charts.', 'Delete', true, () => { S.history = S.history.filter(h => h.id !== id); U.sheet = null; save(); render(); toast('Workout deleted'); }); break;

    case 'routine': U.sheet = { type: 'routine', id }; renderSheet(); break;
    case 'rt-add': U.sheet = { type: 'picker', target: U.sheet.id, q: '', m: null }; renderSheet(); break;

    case 'delete-routine': { const rid = U.sheet.id; confirmDlg('Delete routine?', 'Past workouts are kept.', 'Delete', true, () => { S.routines = S.routines.filter(r => r.id !== rid); U.sheet = null; save(); render(); }); break; }
    case 'new-ex': U.sheet = { type: 'new-ex' }; renderSheet(); setTimeout(() => $('nx-name')?.focus(), 50); break;
    case 'save-ex': { const n = $('nx-name').value.trim(), er = $('nx-err');
      if (!n) { er.textContent = 'Give the exercise a name.'; er.hidden = false; break; }
      if (S.exercises.some(x => x.name.toLowerCase() === n.toLowerCase())) { er.textContent = `${n} is already in your library.`; er.hidden = false; break; }
      S.exercises.push({ id: uid(), name: n, muscle: $('nx-m').value, equip: $('nx-e').value, custom: true }); U.sheet = null; save(); render(); toast(`Added ${n}`); break; }
    case 'seg': U.libSeg = t.dataset.k; renderScreen(); break;
    case 'lib-muscle': U.libMuscle = t.dataset.m || null; renderScreen(); break;
    case 'pick-muscle': U.sheet.m = t.dataset.m || null; renderSheet(); break;
    case 'unit': S.unit = t.dataset.k; save(); render(); break;
    case 'reset': confirmDlg('Reset sample data?', 'Your changes in this prototype are replaced with the sample workouts.', 'Reset', true, () => { const ap = S.appearance; S = seed(); S.appearance = ap; U.rest = null; U.workoutOpen = false; U.exercise = null; save(); render(); toast('Sample data restored'); }); break;
    case 'clear': confirmDlg('Start with no data?', 'History and routines are cleared so you can try Volt from scratch. The exercise library stays.', 'Clear', true, () => { const fresh = seed(); S = { ...fresh, name: S.name, unit: S.unit, appearance: S.appearance, routines: [], history: [], sample: false }; U.rest = null; U.workoutOpen = false; U.exercise = null; save(); render(); }); break;
    case 'dlg-cancel': U.dialog = null; renderDialog(); break;
    case 'dlg-ok': { const fn = U.dialog.fn; U.dialog = null; renderDialog(); fn(); break; }
  }
});
$('device').addEventListener('input', e => {
  const t = e.target, k = t.dataset.input; if (!k) return;
  const a = S.active;
  if (k === 'g-email' || k === 'g-pw' || k === 'g-pw2') {
    U.gate[{ 'g-email': 'email', 'g-pw': 'pw', 'g-pw2': 'pw2' }[k]] = t.value; U.gate.err = '';
    const go = $('g-go'); if (go) go.disabled = !gateValid();
    return;
  }
  if (k === 'set-w') { const v = parseFloat(t.value.replace(',', '.')); a.logs[+t.dataset.li].sets[+t.dataset.si].w = isNaN(v) ? 0 : fromDisp(v); save(); }
  else if (k === 'set-r') { const v = parseInt(t.value, 10); a.logs[+t.dataset.li].sets[+t.dataset.si].r = isNaN(v) ? 0 : v; save(); }
  else if (k === 'w-title') { a.title = t.value; save(); }
  else if (k === 'name') { S.name = t.value; save(); const av = document.querySelector('.avatar'); if (av) av.textContent = (S.name || '?')[0].toUpperCase(); }
  else if (k === 'lib-search') { U.libSearch = t.value; $('lib-list').innerHTML = exRows(filterEx(U.libSearch, U.libMuscle), 'open-ex'); mountThumbs($('lib-list')); }
  else if (k === 'pick-search') { U.sheet.q = t.value; $('pick-list').innerHTML = exRows(filterEx(U.sheet.q, U.sheet.m), 'pick'); mountThumbs($('pick-list')); }
});
$('device').addEventListener('change', e => {
  if (e.target.dataset.change === 'trend') { U.trendEx = e.target.value; renderScreen(); }
  if (e.target.dataset.input === 'set-w' || e.target.dataset.input === 'set-r') renderWorkout();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (U.dialog) { U.dialog = null; renderDialog(); } else if (U.sheet) { U.sheet = null; renderSheet(); } else if (U.exercise) { U.exercise = null; renderExercise(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.appearance === 'auto') applyAppearance(); });

// ---------- Clock ----------
setInterval(() => {
  $('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' });
  if (S.active) document.querySelectorAll('[data-timer]').forEach(n => n.textContent = fmtDur((Date.now() - S.active.start) / 1000));
  if (U.rest) {
    const left = (U.rest.ends - Date.now()) / 1000;
    if (left <= 0) { U.rest = null; renderWorkout(); toast('Rest over · next set'); }
    else { const r = document.querySelector('[data-rest]'); if (r) r.textContent = fmtDur(left).replace(/^0/, ''); const b = document.querySelector('[data-rest-bar]'); if (b) b.style.width = Math.max(0, left / U.rest.total * 100) + '%'; }
  }
}, 1000);
$('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' });
render();
// Test hook (used by the automated checks)
window.__volt = { ANIMS, openExercise, state: () => S };
})();
</script>
