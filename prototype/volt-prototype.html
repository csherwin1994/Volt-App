:root {

/* Tab bar */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 8px calc(26px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); z-index: 5; }

"force":"push","steps":["Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length.","Next, lower yourself downward until your chest almost touches the floor as you inhale.","Now breathe out and press your upper body back up to the starting position while squeezing your chest.","After a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed."]},"Pull Up":{"p":["lats"],"s":["biceps","middle back"],"lvl":"beginner","mech":"compound","force":"pull","steps":["Grab the pull-up bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","Pull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."]},"Lat Pulldown":{"p":["lats"],"s":["biceps","middle back","shoulders"],"lvl":"beginner","mech":"compound","force":"pull","steps":["Sit down on tarting position.","Now, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.","Then inhale and slowly lower the barbell back to the starting position.","Repeat for the recommended amount of repetitions."]},"Seated Cable Row":{"p":["middle back"],"s":["biceps","lats","shoulders"],"lvl":"beginner","mech":"compound","force":"pull","steps":["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.","Repeat for the recommended amount of repetitions."]},"Dumbbell Row":{"p":["middle back"],"s":["biceps","lats","shoulders"],"lvl":"beginner","mech":"compound","force":"pull","steps":["Choose a flat bench and place a dumbbell on each side of it.","Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.","Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.","Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.","Lower the resistance straight down to the starting position. Breathe in as you perform this step."]},"Overhead Press":{"p":["shoulders"],"s":["triceps"],"lvl":"beginner","mech":"compound","force":"push","steps":["Start by placing a barbell that is about chest high on a squat rack. Once you have selected the weights, grab the barbell using a pronated (palms facing forward) grip. Make sure to grip the bar wider than shoulder width apart from each other.","Slightly bend the knees and place the barbell on your collar bone. Lift the barbell up keeping it lying on your chest. Take a step back and position your feet shoulder width apart from each other.","Once you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the collarbone slowly as you inhale.","Lift the bar back up to the starting position as you exhale."]},"Dumbbell Shoulder Press":{"p":["shoulders"],"s":["triceps"],"lvl":"intermediate","mech":"compound","force":"push","steps":["While holding a dumbbell in each hand, sit on a military press bench or utility bench that has back support. Place the dumbbells upright on top of your thighs.","Now raise the dumbbells to shoulder height one at a time using your thighs to help propel them up into position.","Make sure to rotate your wrists so that the palms of your hands are facing forward. This is your starting position.","Now, exhale and push the dumbbells upward until they touch at the top.","Then, after a brief pause at the top contracted position, slowly lower the weights back down to the starting position while inhaling."]},"Lateral Raise":{"p":["shoulders"],"s":[],"lvl":"beginner","mech":"isolation","force":"push","steps":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.","While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions."]},"Face Pull":{"p":["shoulders"],"s":["middle back"],"lvl":"intermediate","mech":"compound","force":"pull","steps":["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."]},"Arnold Press":{"p":["shoulders"],"s":["triceps"],"lvl":"intermediate","mech":"compound","force":"push","steps":["Sit on an exercise bench with back support and hold two dumbbells in front of you at about upper chest level with your palms facing your body and your elbows bent. Tip: Your arms should be next to your torso. The starting position should look like the contracted portion of a dumbbell curl.","Now to perform the movement, raise the dumbbells as you rotate the palms of your hands until they are facing forward.","Continue lifting the dumbbells until your arms are extended above you in straight arm position. Breathe out as you perform this portion of the movement.","After a second pause at the top, begin to lower the dumbbells to the original position by rotating the palms of your hands towards you. Tip: The left arm will be rotated in a counter clockwise manner while the right one will be rotated clockwise. Breathe in as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."]},"Barbell Curl":{"p":["biceps"],"s":["forearms"],"lvl":"beginner","mech":"isolation","force":"pull","steps":["Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."]},"Dumbbell Curl":{"p":["biceps"],"s":["forearms"],"lvl":"beginner","mech":"isolation","force":"pull","steps":["Stand up straight with a dumbbell in each hand at arm's length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.","Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps. Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a brief pause as you squeeze your biceps.","Then, inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."]},"Hammer Curl":{"p":["biceps"],"s":[],"lvl":"beginner","mech":"isolation","force":"pull","steps":["Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.","The palms of the hands should be facing your torso. This will be your starting position.","Now, while holding your upper arm stationary, exhale and curl the weight forward while contracting the biceps. Continue to raise the weight until the biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow stationary and only moving your forearm.","After the brief pause, inhale and slowly begin the lower the dumbbells back down to the starting position.","Repeat for the recommended amount of repetitions."]},"Preacher Curl":{"p":["biceps"],"s":[],"lvl":"beginner","mech":"isolation","force":"pull","steps":["To perform this movement you will need a preacher bench and an E-Z bar. Grab the E-Z curl bar at the close inner handle (either have someone hand you the bar which is preferable or grab the bar from the front bar rest provided by most preacher benches). The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar.","With the upper arms positioned against the preacher bench pad and the chest against it, hold the E-Z Curl Bar at shoulder length. This will be your starting position.","As you breathe in, slowly lower the bar until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the bar is at shoulder height. Squeeze the biceps hard and hold this position for a second.","Repeat for the recommended amount of repetitions."]},"Tricep Pushdown":{"p":["triceps"],"s":[],"lvl":"beginner","mech":"isolation","force":"push","steps":["Attach a straight or angled bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."]},"Close Grip Bench Press":{"p":["triceps"],"s":["chest","shoulders"],"lvl":"beginner","mech":"compound","force":"push","steps":["Lie back on a flat bench. Using a close grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that - as opposed to a regular bench press - you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."]},"Squat":{"p":["quadriceps"],"s":["calves","glutes","hamstrings","lower back"],"lvl":"beginner","mech":"compound","force":"push","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack to just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees and hips as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position."]},"Front Squat":{"p":["quadriceps"],"s":["calves","glutes","hamstrings"],"lvl":"expert","mech":"compound","force":"push","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, bring your arms up under the bar while keeping the elbows high and the upper arm slightly above parallel to the floor. Rest the bar on top of the deltoids and cross your arms while grasping the bar for total control.","Lift the bar off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor mainly with the middle of your foot as you straighten the legs again and go back to the starting position."]},"Leg Press":{"p":["quadriceps"],"s":["calves","glutes","hamstrings"],"lvl":"beginner","mech":"compound","force":"push","steps":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."]},"Romanian Deadlift":{"p":["hamstrings"],"s":["calves","glutes","lower back"],"lvl":"intermediate","mech":"compound","force":"pull","steps":["Put a barbell in front of you on the ground and grab it using a pronated (palms facing down) grip that a little wider than shoulder width. Tip: Depending on the weight used, you may need wrist wraps to perform the exercise and also a raised platform in order to allow for better range of motion.","Bend the knees slightly and keep the shins vertical, hips back and back straight. This will be your starting position.","Keeping your back and arms completely straight at all times, use your hips to lift the bar as you exhale. Tip: The movement should not be fast but steady and under control.","Once you are standing completely straight up, lower the bar by pushing the hips back, only slightly bending the knees, unlike when squatting. Tip: Take a deep breath at the start of the movement and keep your chest up. Hold your breath as you lower and exhale as you complete the movement.","Repeat for the recommended amount of repetitions."]},"Leg Extension":{"p":["quadriceps"],"s":[],"lvl":"beginner","mech":"isolation","force":"push","steps":["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.","Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.","Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.","Repeat for the recommended amount of times."]},"Leg Curl":{"p":["hamstrings"],"s":[],"lvl":"beginner","mech":"isolation","force":"pull","steps":["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.","Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.","As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."]},"Calf Raise":{"p":["calves"],"s":[],"lvl":"beginner","mech":"isolation","force":"push","steps":["Adjust the padded lever of the calf raise machine to fit your height.","Place your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."]},"Hip Thrust":{"p":["glutes"],"s":["calves","hamstrings"],"lvl":"intermediate","mech":"compound","force":"push","steps":["Begin seated on the ground with a bench directly behind you. Have a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise.","Roll the bar so that it is directly above your hips, and lean back against the bench so that your shoulder blades are near the top of it.","Begin the movement by driving through your feet, extending your hips vertically through the bar. Your weight should be supported by your shoulder blades and your feet. Extend as far as possible, then reverse the motion to return to the starting position."]},"Plank":{"p":["abdominals"],"s":[],"lvl":"beginner","mech":"isolation","force":"static","steps":["Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.","Keep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised."]},"Hanging Leg Raise":{"p":["abdominals"],"s":[],"lvl":"expert","mech":"isolation","force":"pull","steps":["Hang from a chin-up bar with both arms extended at arms length in top of you using either a wide grip or a medium grip. The legs should be straight down with the pelvis rolled slightly backwards. This will be your starting position.","Raise your legs until the torso makes a 90-degree angle with the legs. Exhale as you perform this movement and hold the contraction for a second or so.","Go back slowly to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."]},"Cable Crunch":{"p":["abdominals"],"s":[],"lvl":"beginner","mech":"isolation","force":"pull","steps":["Kneel below a high pulley that contains a rope attachment.","Grasp cable rope attachment and lower the rope until your hands are placed next to your face.","Flex your hips slightly and allow the weight to hyperextend the lower back. This will be your starting position.","With the hips stationary, flex the waist as you contract the abs so that the elbows travel towards the middle of the thighs. Exhale as you perform this portion of the movement and hold the contraction for a second.","Slowly return to the starting position as you inhale. Tip: Make sure that you keep constant tension on the abs throughout the movement. Also, do not choose a weight so heavy that the lower back handles the brunt of the work."]},"Ab Rollout":{"p":["abdominals"],"s":["shoulders"],"lvl":"intermediate","mech":"compound","force":"pull","steps":["Hold the Ab Roller with both hands and kneel on the floor.","Now place the ab roller on the floor in front of you so that you are on all your hands and knees (as in a kneeling push up position). This will be your starting position.","Slowly roll the ab roller straight forward, stretching your body into a straight position. Tip: Go down as far as you can without touching the floor with your body. Breathe in during this portion of the movement.","After a pause at the stretched position, start pulling yourself back to the starting position as you breathe out. Tip: Go slowly and keep your abs tight at all times."]},"Russian Twist":{"p":["abdominals"],"s":["lower back"],"lvl":"intermediate","mech":"compound","force":"pull","steps":["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.","Elevate your upper body so that it creates an imaginary V-shape with your thighs. Your arms should be fully extended in front of you perpendicular to your torso and with the hands clasped. This is the starting position.","Twist your torso to the right side until your arms are parallel with the floor while breathing out.","Hold the contraction for a second and move back to the starting position while breathing out. Now move to the opposite side performing the same techniques you applied to the right side.","Repeat for the recommended amount of repetitions."]},"Rowing Machine":{"p":["quadriceps"],"s":["biceps","calves","glutes","hamstrings","lower back","middle back"],"lvl":"intermediate","mech":"","force":"","steps":["To begin, seat yourself on the rower. Make sure that your heels are resting comfortably against the base of the foot pedals and that the straps are secured. Select the program that you wish to use, if applicable. Sit up straight and bend forward at the hips.","There are three phases of movement when using a rower. The first phase is when you come forward on the rower. Your knees are bent and against your chest. Your upper body is leaning slightly forward while still maintaining good posture. Next, push against the foot pedals and extend your legs while bringing your hands to your upper abdominal area, squeezing your shoulders back as you do so. To avoid straining your back, use primarily your leg and hip muscles.","The recovery phase simply involves straightening your arms, bending the knees, and bringing your body forward again as you transition back into the first phase."]},"Treadmill":{"p":["quadriceps"],"s":["calves","glutes","hamstrings"],"lvl":"beginner","mech":"","force":"","steps":["To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise. Elevation can be adjusted to change the intensity of the workout.","Treadmills offer convenience, cardiovascular benefits, and usually have less impact than running outside. A 150 lb person will burn over 450 calories running 8 miles per hour for 30 minutes. Maintain proper posture as you run, and only hold onto the handles when necessary, such as when dismounting or checking your heart rate."]},"Assault Bike":{"p":["abdominals"],"s":[],"lvl":"beginner","mech":"compound","force":"pull","steps":["Lie flat on the floor with your lower back pressed to the ground. For this exercise, you will need to put your hands beside your head. Be careful however to not strain with the neck as you perform it. Now lift your shoulders into the crunch position.","Bring knees up to where they are perpendicular to the floor, with your lower legs parallel to the floor. This will be your starting position.","Now simultaneously, slowly go through a cycle pedal motion kicking forward with the right leg and bringing in the knee of the left leg. Bring your right elbow close to your left knee by crunching to the side, as you breathe out.","Go back to the initial position as you breathe in.","Crunch to the opposite side as you cycle your legs and bring closer your left elbow to your right knee and exhale."]},"Power Clean":{"p":["hamstrings"],"s":["calves","forearms","glutes","lower back","middle back","quadriceps","shoulders","traps","triceps"],"lvl":"intermediate","mech":"compound","force":"pull","steps":["Stand with your feet slightly wider than shoulder width apart and toes pointing out slightly.","Squat down and grasp bar with a closed, pronated grip. Your hands should be slightly wider than shoulder width apart outside knees with elbows fully extended.","Place the bar about 1 inch in front of your shins and over the balls of your feet.","Your back should be flat or slightly arched, your chest held up and out and your shoulder blades should be retracted.","Keep your head in a neutral position (in line with vertebral column and not tilted or rotated) with your eyes focused straight ahead. Inhale during this phase."]}};

      <div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px" class="mono">${weeks.map((w, i) => `<span style="font-size:10px;color:var(--ink-3)">${i === 7 ? 'NOW' : fmtDate(w, { day: 'numeric' })}</span>`).join('')}</div></section>

function topsFor(ex) {
  return S.history.slice().reverse().map(h => { const l = h.logs.find(l => l.ex === ex); return l && l.sets.length ? { t: h.start, w: Math.max(...l.sets.map(s => s.w)) } : null; }).filter(Boolean);
}
function strengthBlock(ex, logged) {
  const pts = topsFor(ex);
  const best = Math.max(0, ...pts.map(p => p.w));
  const gain = pts.length > 1 ? pts.at(-1).w - pts[0].w : 0;
  let chart = '';
  if (pts.length > 1) {
    const W = 350, H = 110, lo = Math.min(...pts.map(p => p.w)) * 0.95, hi = best * 1.02;
    const x = i => W * i / (pts.length - 1), y = v => 100 - 90 * (v - lo) / (hi - lo || 1);
    const line = pts.map((p, i) => `${x(i)},${y(p.w)}`).join(' ');
    chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Heaviest ${esc(ex)} set per workout"><line x1="0" y1="10" x2="${W}" y2="10" stroke="var(--line)"/><line x1="0" y1="55" x2="${W}" y2="55" stroke="var(--line)"/><line x1="0" y1="100" x2="${W}" y2="100" stroke="var(--label)"/>
      <polygon points="0,100 ${line} ${W},100" fill="var(--accent-soft)"/><polyline points="${line}" fill="none" stroke="var(--accent-text)" stroke-width="1.5"/><rect x="${W - 6}" y="${y(pts.at(-1).w) - 6}" width="12" height="12" fill="var(--accent)"/></svg>`;
  }
  return `<section class="sec" style="gap:14px"><div class="row-between"><span class="lbl">Strength</span>
    <span class="sel-wrap"><select class="sel" data-change="trend" aria-label="Exercise">${logged.map(e => `<option ${e === ex ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>${ic('down', 14)}</span></div>
    <button data-act="open-ex" data-name="${esc(ex)}" style="display:flex;align-items:baseline;gap:6px;text-align:left"><span style="font-size:56px;line-height:48px;letter-spacing:-2.4px">${fmtW(best)}</span><span class="cap">${unitU()}${gain ? ` · +${toDisp(gain)} since ${fmtDate(pts[0].t, { day: 'numeric', month: 'short' })}` : ''}</span></button>
    ${chart || '<p class="lead">Log this exercise twice to see a trend.</p>'}</section>`;
}

function platesFor(total) {

  let side = Math.max(0, (total - bar) / 2); const out = [];
  for (const sz of sizes) while (side >= sz - 0.01) { side -= sz; out.push(sz); }
  return { bar, out, sizes };
}

          ${tops.length > 1 ? `<div class="hist">${tops.slice(-8).map((p, i, arr) => { const lo = Math.min(...arr.map(a => a.w)) * 0.9, hi = Math.max(...arr.map(a => a.w)); return `<span style="height:${Math.max(4, 88 * (p.w - lo) / (hi - lo || 1))}px;background:${i === arr.length - 1 ? 'var(--accent)' : 'var(--bar)'}"></span>`; }).join('')}</div>` : ''}`
          : '<p class="lead">Log this exercise in a workout to start tracking records.</p>'}</section>

}

function openExercise(name) { dropAnims('ex'); U.exercise = { name, speed: 1, weight: null, step: 0 }; $('exercise').innerHTML = ''; renderExercise(); }

// ---------- Active workout ----------
function renderWorkout() {
  const el = $('workout');
  if (!S.active || !U.workoutOpen) { el.innerHTML = ''; dropAnims('w:'); return; }
  const a = S.active;
  const total = a.logs.reduce((n, l) => n + l.sets.length, 0);
  const done = a.logs.reduce((n, l) => n + l.sets.filter(s => s.done).length, 0);
  const vol = a.logs.reduce((n, l) => n + l.sets.filter(s => s.done).reduce((b, s) => b + s.w * s.r, 0), 0);
  const scroll = el.querySelector('.scroll')?.scrollTop || 0;
  const fresh = !el.firstChild;
  el.innerHTML = `<div class="layer ${fresh ? 'slide-up' : ''}">
    <div class="statusbar" aria-hidden="true"><span></span><span class="notch"></span><span></span></div>
    <div class="w-top"><button class="icon-btn" data-act="minimize" aria-label="Minimise workout">${ic('down', 20)}</button>
      <span class="w-live"><span style="width:7px;height:7px;background:var(--accent);flex:none"></span><input id="w-title" data-input="w-title" value="${esc(a.title)}" aria-label="Workout name"></span>
      <button class="icon-btn" data-act="discard" aria-label="Cancel workout" title="Cancel workout">${ic('x', 20)}</button><button class="btn gold sm" data-act="finish">Finish ${ic('arrow', 14)}</button></div>
    <div class="w-clock"><span class="hero" data-timer>${fmtDur((Date.now() - a.start) / 1000)}</span><span class="w-meta cap"><span>${done} / ${total} sets</span><span>${fmtVol(vol)} ${unitU()}</span></span></div>
    <div class="w-progress"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div>
    <div class="scroll"><div class="w-body">
      ${a.logs.map((l, li) => {
        const prev = lastSets(l.ex) || [];
        return `<section class="ex"><div class="ex-hd"><button class="nm" data-act="open-ex" data-name="${esc(l.ex)}">${esc(l.ex)}</button><span style="display:flex;align-items:center;gap:4px"><span class="cap" style="font-size:10px">${l.muscle}</span>${motionFor(l.ex) ? `<button class="dm" data-act="demo-toggle" data-name="${esc(l.ex)}" aria-expanded="${!!U.demos[l.ex]}">${U.demos[l.ex] ? 'Hide' : 'Demo'}</button>` : ''}<button class="icon-btn" style="width:36px;height:36px" data-act="ex-menu" data-li="${li}" aria-label="Exercise options">${ic('more', 18)}</button></span></div>
        ${U.demos[l.ex] && motionFor(l.ex) ? `<div class="mini-demo"><div class="ma" data-anim="${esc(l.ex)}"></div><span class="fr" data-mphase="${esc(l.ex)}"></span><button data-act="open-ex" data-name="${esc(l.ex)}">Full guide →</button></div>` : ''}
        ${U.menu === li ? `<div class="ex-menu"><button class="btn danger sm" data-act="remove-ex" data-li="${li}">Remove exercise</button><button class="btn outline sm" data-act="ex-menu" data-li="-1">Cancel</button></div>` : ''}
        <div class="set head"><span>Set</span><span>Prev</span><span style="text-align:right">${unitU()}</span><span style="text-align:right">Reps</span><span></span></div>
        ${l.sets.map((s, si) => `<div class="set ${s.done ? 'done' : ''}"><button class="sn" data-act="remove-set" data-li="${li}" data-si="${si}" title="Remove set">${s.pr ? 'PR' : pad2(si + 1)}</button><span class="pv">${prev[si] ? `${fmtW(prev[si].w)} × ${prev[si].r}` : '–'}</span>
          <input inputmode="decimal" id="w-${li}-${si}" data-input="set-w" data-li="${li}" data-si="${si}" value="${fmtW(s.w)}" placeholder="0" aria-label="Weight"><input inputmode="numeric" id="r-${li}-${si}" data-input="set-r" data-li="${li}" data-si="${si}" value="${s.r || ''}" placeholder="0" aria-label="Reps">
          <button class="tick" data-act="toggle-set" data-li="${li}" data-si="${si}" aria-pressed="${s.done}" aria-label="Mark set ${si + 1} done">${ic('check', 16)}</button></div>`).join('')}
        <button class="addset" data-act="add-set" data-li="${li}">+ ADD SET</button></section>`;
      }).join('')}
      <button class="btn outline" data-act="add-ex">Add Exercise ${ic('plus', 18)}</button>
      <button class="btn text" data-act="discard">Cancel workout</button>
    </div></div>
    ${U.banner ? `<div class="banner" role="status">${esc(U.banner)}</div>` : ''}
    ${U.rest ? `<div class="rest" role="timer"><div class="rest-row"><div style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="lbl" style="color:inherit;opacity:.65;font-weight:400">Rest</span><span class="rest-time" data-rest>${fmtDur((U.rest.ends - Date.now()) / 1000).replace(/^0/, '')}</span></div><button data-act="rest-add" data-k="-15">−15</button><button data-act="rest-add" data-k="15">+15</button><button data-act="rest-skip">SKIP</button></div><div class="track"><i data-rest-bar style="width:${Math.max(0, (U.rest.ends - Date.now()) / (U.rest.total * 10))}%"></i></div></div>` : ''}
  </div>`;
  el.querySelector('.scroll').scrollTop = scroll;
  const live = new Set();
  el.querySelectorAll('[data-anim]').forEach(n => {
    const name = n.dataset.anim; live.add('w:' + name);
    mountAnim('w:' + name, n, name, { onPhase: lbl => { const p = el.querySelector(`[data-mphase="${CSS.escape(name)}"]`); if (p) p.textContent = lbl; } });
  });
  for (const k of Object.keys(ANIMS)) if (k.startsWith('w:') && !live.has(k)) { ANIMS[k].ctl.destroy(); delete ANIMS[k]; }
}


// ---------- Login and welcome ----------
const gateValid = () => { const g = U.gate; const ok = g.email.includes('@') && g.email.includes('.') && g.pw.length >= 6; return g.mode === 'up' ? ok && g.pw2 === g.pw : ok; };

    <div class="seg" role="tablist"><button class="${up ? '' : 'on'}" data-act="gate-mode" data-k="in">Sign in</button><button class="${up ? 'on' : ''}" data-act="gate-mode" data-k="up">Create account</button></div>
    <div style="display:flex;flex-direction:column;gap:16px;margin-top:24px">${field('g-email', 'Email', 'you@example.com', 'email', g.email)}${field('g-pw', 'Password', 'At least 6 characters', 'password', g.pw)}${up ? field('g-pw2', 'Confirm password', 'Repeat password', 'password', g.pw2) : ''}</div>

    <div class="or"><i></i>OR<i></i></div>
    <button class="btn apple" data-act="gate-social">Sign in with Apple</button>

}
const afterGate = () => { U.gate = { mode: 'in', email: '', pw: '', pw2: '', err: '' }; S.stage = S.seenWelcome ? 'app' : 'welcome'; save(); render(); };

// ---------- Sheets and dialogs ----------
function openPicker(target) { U.sheet = { type: 'picker', target, q: '', m: null }; renderSheet(); setTimeout(() => $('pick-search')?.focus(), 50); }
const sheetShell = (title, body) => `<div class="layer sheet-wrap" data-act="close-sheet-bg"><div class="sheet" role="dialog" aria-label="${esc(title || 'Sheet')}"><div class="sheet-hd"><span class="lbl">${esc(title)}</span><button class="icon-btn" data-act="close-sheet" aria-label="Close">${ic('x', 20)}</button></div><div class="sheet-body">${body}</div></div></div>`;
function renderSheet() {
  const el = $('sheet'), s = U.sheet;
  if (!s) { el.innerHTML = ''; el.dataset.key = ''; return; }
  const animate = el.dataset.key !== s.type + (s.id || s.d || '');
  el.dataset.key = s.type + (s.id || s.d || '');
  let html = '';
  if (s.type === 'picker') {
    html = sheetShell('Add exercise', `<label class="search" for="pick-search">${ic('search')}<input id="pick-search" data-input="pick-search" placeholder="Search exercises" value="${esc(s.q)}" autocomplete="off"></label>${chipRow(s.m, 'pick-muscle')}<div class="rules" id="pick-list">${exRows(filterEx(s.q, s.m), 'pick')}</div>`);
  } else if (s.type === 'detail' || s.type === 'summary') {
    const h = S.history.find(x => x.id === s.id); if (!h) { U.sheet = null; el.innerHTML = ''; return; }
    html = sheetShell(s.type === 'summary' ? 'Workout saved' : fmtDate(h.start, { weekday: 'long', day: 'numeric', month: 'long' }), `
      <h1>${esc(h.title)}</h1>
      <div class="grid g3"><div><span class="k">Time</span><span class="val">${Math.round((h.end - h.start) / 60e3)}<span class="u">MIN</span></span></div><div><span class="k">Sets</span><span class="val">${setsOf(h)}</span></div><div><span class="k">Volume</span><span class="val">${fmtVol(volOf(h))}<span class="u">${unitU()}</span></span></div></div>
      ${h.logs.map(l => `<div class="sec" style="gap:8px"><button class="row-between" data-act="open-ex" data-name="${esc(l.ex)}"><span style="font-size:20px;letter-spacing:-.5px">${esc(l.ex)}</span><span class="cap">${l.muscle}</span></button><div class="rules">${l.sets.map((st, i) => `<div class="r" style="padding:10px 0"><span class="n">${pad2(i + 1)}</span><span class="main"><span class="v" style="color:var(--label)">${fmtW(st.w) || 0} ${unitU()} × ${st.r}</span></span>${st.pr ? '<span class="tag gold">PR</span>' : ''}</div>`).join('')}</div></div>`).join('') || '<p class="lead">No completed sets were saved.</p>'}
      ${s.type === 'detail' ? `<button class="btn danger" data-act="delete-workout" data-id="${h.id}">Delete Workout ${ic('arrow')}</button>` : `<button class="btn primary" data-act="close-sheet">Done ${ic('arrow')}</button>`}`);
  } else if (s.type === 'day') {
    const day = startOfDay(s.d).getTime(), todayMs = startOfDay(Date.now()).getTime();
    const ws = S.history.filter(h => sameDay(h.start, day)).sort((a, b) => a.start - b.start);
    const live = S.active && sameDay(S.active.start, day) ? S.active : null;
    const label = fmtDate(day, { weekday: 'long', day: 'numeric', month: 'long' });
    const kind = day > todayMs ? 'Coming up' : day === todayMs ? 'Today' : 'Past';
    const rec = day === todayMs && !S.active ? recommend() : null;
    html = sheetShell(label, `
      <div class="sec" style="gap:10px"><span class="lbl">${kind} · ${ws.length + (live ? 1 : 0)} ${ws.length + (live ? 1 : 0) === 1 ? 'workout' : 'workouts'}</span><h1>${ws.length || live ? 'Trained.' : day > todayMs ? 'Nothing planned.' : 'Rest day.'}</h1></div>
      ${ws.length ? `<div class="rules">${ws.map(h => `<button class="r" data-act="detail" data-id="${h.id}"><span class="main"><span class="t">${esc(h.title)}</span><span class="cap">${fmtDate(h.start, { hour: '2-digit', minute: '2-digit' })} · ${Math.round((h.end - h.start) / 60e3)} min · ${setsOf(h)} sets · ${fmtVol(volOf(h))} ${unitU()}</span></span><span style="color:var(--ink-3)">${ic('arrow', 16)}</span></button>`).join('')}</div>` : ''}
      ${live ? `<button class="btn primary" data-act="open-workout">Resume ${esc(live.title)} ${ic('arrow')}</button>` : ''}
      ${rec && rec.routine ? `<p class="lead">${esc(rec.reason)}</p><button class="btn primary" data-act="start-planned" data-id="${rec.routine.id}">Start ${esc(rec.title)} ${ic('arrow')}</button>` : ''}
      ${!ws.length && !live && day < todayMs ? '<p class="lead">No workout was logged on this day.</p>' : ''}
      ${!ws.length && !live && day > todayMs ? '<p class="lead">Your suggestion for this day is chosen on the day, from what you have trained since.</p>' : ''}`);
  } else if (s.type === 'new-ex') {
    html = sheetShell('New exercise', `<div class="field"><label for="nx-name">Name</label><input class="input" id="nx-name" placeholder="e.g. Pendlay Row" maxlength="40"></div>
      <div class="field"><label for="nx-m">Muscle group</label><select class="sel" id="nx-m" style="width:100%;height:44px">${MUSCLES.map(m => `<option>${m}</option>`).join('')}</select></div>
      <div class="field"><label for="nx-e">Equipment</label><select class="sel" id="nx-e" style="width:100%;height:44px">${['Barbell', 'Dumbbell', 'Machine', 'Cable', 'Bodyweight', 'Kettlebell', 'Bands', 'Other'].map(m => `<option>${m}</option>`).join('')}</select></div>
      <p class="cap" id="nx-err" style="color:var(--danger)" hidden></p><button class="btn primary" data-act="save-ex">Save Exercise ${ic('arrow')}</button>`);
  } else if (s.type === 'new-routine') {
    html = sheetShell('New routine', `<div class="field"><label for="nr-name">Name</label><input class="input" id="nr-name" placeholder="e.g. Upper Body" maxlength="30"></div><p class="cap" id="nr-err" style="color:var(--danger)" hidden></p><button class="btn primary" data-act="save-routine">Create and Add Exercises ${ic('arrow')}</button>`);
  } else if (s.type === 'routine') {
    const rt = S.routines.find(r => r.id === s.id); if (!rt) { U.sheet = null; el.innerHTML = ''; return; }
    html = sheetShell('Routine', `<h1>${esc(rt.name)}</h1>
      ${rt.items.length ? `<div class="rules">${rt.items.map((it, i) => `<div class="r"><span class="n">${pad2(i + 1)}</span><button class="main" data-act="open-ex" data-name="${esc(it.ex)}" style="text-align:left"><span class="t">${esc(it.ex)}</span><span class="cap">${it.sets} × ${it.reps}${it.weight ? ` · ${fmtW(it.weight)} ${unitU()}` : ''}</span></button><button class="icon-btn" data-act="rt-remove" data-i="${i}" aria-label="Remove ${esc(it.ex)}">${ic('x', 16)}</button></div>`).join('')}</div>` : '<div class="empty"><b>No exercises yet.</b></div>'}
      <button class="btn outline" data-act="rt-add">Add Exercise ${ic('plus')}</button>
      <button class="btn primary" data-act="start-routine" data-id="${rt.id}" ${rt.items.length ? '' : 'disabled style="opacity:.4"'}>Start Workout ${ic('arrow')}</button>
      <button class="btn text" data-act="delete-routine">Delete routine</button>`);
  }
  el.innerHTML = html;
  mountThumbs(el);
  if (!animate) el.querySelectorAll('.sheet-wrap,.sheet').forEach(n => n.style.animation = 'none');
}
function renderDialog() {

    <div class="acts"><button class="btn outline" data-act="dlg-cancel">${esc(d.no || 'Cancel')}</button><button class="btn ${d.danger ? 'danger' : 'primary'}" data-act="dlg-ok">${esc(d.ok)}</button></div></div></div>` : '';

// ---------- Events ----------
$('device').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id, li = +t.dataset.li, si = +t.dataset.si, a = S.active;
  switch (act) {
    case 'gate-mode': U.gate.mode = t.dataset.k; U.gate.err = ''; renderGate(); break;
    case 'gate-go': if (gateValid()) afterGate(); break;
    case 'gate-skip': afterGate(); break;
    case 'gate-social': toast('Not available in the prototype'); break;
    case 'welcome-go': S.seenWelcome = true; S.stage = 'app'; save(); render(); break;
    case 'show-login': S.stage = 'login'; S.seenWelcome = false; U.workoutOpen = false; U.exercise = null; save(); render(); break;
    case 'demo-toggle': { const n = t.dataset.name; U.demos[n] = !U.demos[n]; renderWorkout(); break; }
    case 'day': U.sheet = { type: 'day', d: +t.dataset.d }; renderSheet(); break;
    case 'tab': U.tab = t.dataset.k; U.exercise = null; render(); $('screen').scrollTop = 0; break;
    case 'appearance': S.appearance = t.dataset.k; save(); render(); break;
    case 'start': startWorkout(null); break;
    case 'start-planned': { const rt = S.routines.find(r => r.id === id); U.sheet = null; startWorkout(rt, true); break; }
    case 'start-routine': { const rt = S.routines.find(r => r.id === id); U.sheet = null; if (S.active) { U.workoutOpen = true; render(); toast('Finish your current workout first'); } else startWorkout(rt, true); break; }
    case 'open-workout': U.workoutOpen = true; U.exercise = null; render(); break;
    case 'minimize': U.workoutOpen = false; U.menu = null; render(); break;
    case 'open-ex': U.sheet = null; renderSheet(); openExercise(t.dataset.name); break;
    case 'close-ex': U.exercise = null; renderExercise(); break;
    case 'demo-play': { const a = ANIMS.ex; if (!a) break; if (a.ctl.playing) { a.ctl.pause(); t.innerHTML = PLAY_ICON; t.setAttribute('aria-label', 'Play demo'); } else { a.ctl.play(); t.innerHTML = PAUSE_ICON; t.setAttribute('aria-label', 'Pause demo'); } break; }
    case 'demo-speed': { U.exercise.speed = +t.dataset.k; if (ANIMS.ex) ANIMS.ex.ctl.setSpeed(U.exercise.speed); t.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === t)); break; }
    case 'w-minus': U.exercise.weight = Math.max(0, U.exercise.weight - step()); renderExercise(); break;
    case 'w-plus': U.exercise.weight = U.exercise.weight + step(); renderExercise(); break;
    case 'w-set': U.exercise.weight = 20; renderExercise(); break;
    case 'ex-step': U.exercise.step = +t.dataset.k; renderExercise(); break;
    case 'ex-prev': U.exercise.step = Math.max(0, U.exercise.step - 1); renderExercise(); break;
    case 'ex-next': U.exercise.step = Math.min(details(U.exercise.name).steps.length - 1, U.exercise.step + 1); renderExercise(); break;
    case 'ex-add': case 'ex-start': {
      const name = t.dataset.name, ex = S.exercises.find(x => x.name === name), tg = target(name), w = U.exercise?.weight ?? tg.weight ?? 0;
      if (!S.active) startWorkout(null);
      S.active.logs.push({ ex: name, muscle: ex?.muscle || 'Full Body', sets: Array.from({ length: tg.sets }, () => ({ w, r: tg.reps, done: false })) });
      U.sheet = null; U.exercise = null; U.workoutOpen = true; save(); render(); toast(`Added ${name}`); break; }
    case 'finish': {
      const done = a.logs.reduce((n, l) => n + l.sets.filter(s => s.done).length, 0);
      if (!done) { confirmDlg('No sets completed', 'Tick off at least one set before finishing, or cancel this workout.', 'OK', false, () => {}); break; }
      confirmDlg('Finish workout?', `Save ${done} completed ${done === 1 ? 'set' : 'sets'} to your history. Unticked sets are left out.`, 'Finish', false, finishWorkout); break; }
    case 'discard': U.dialog = { title: 'Cancel this workout?', msg: 'Nothing from it will be saved. Your history stays as it is.', ok: 'Cancel Workout', no: 'Keep Training', danger: true, fn: discardWorkout }; renderDialog(); break;
    case 'toggle-set': {
      const l = a.logs[li], s = l.sets[si]; s.done = !s.done;
      if (s.done) {
        s.pr = isPR(l.ex, s.w, s.r, a.id) && !l.sets.some((o, k) => k !== si && o.done && o.w >= s.w && o.r >= s.r);
        U.rest = { total: 90, ends: Date.now() + 90e3 };
        if (s.pr) { U.banner = `New PR · ${l.ex} ${fmtW(s.w)} ${unitU()} × ${s.r}`; setTimeout(() => { U.banner = null; renderWorkout(); }, 3000); }
      } else s.pr = false;
      save(); renderWorkout(); break; }
    case 'add-set': { const l = a.logs[li], last = l.sets.at(-1); l.sets.push({ w: last?.w || 0, r: last?.r || 0, done: false }); save(); renderWorkout(); break; }
    case 'remove-set': { const l = a.logs[li]; if (l.sets.length > 1) { l.sets.splice(si, 1); save(); renderWorkout(); } else toast('Remove the exercise to delete its last set'); break; }
    case 'ex-menu': U.menu = li >= 0 && U.menu !== li ? li : null; renderWorkout(); break;
    case 'remove-ex': a.logs.splice(li, 1); U.menu = null; save(); renderWorkout(); break;
    case 'add-ex': openPicker('workout'); break;
    case 'rest-add': U.rest.ends += +t.dataset.k * 1000; U.rest.total = Math.max(U.rest.total + +t.dataset.k, 1); if (U.rest.ends <= Date.now()) U.rest = null; renderWorkout(); break;
    case 'rest-skip': U.rest = null; renderWorkout(); break;
    case 'pick': {
      const ex = S.exercises.find(x => x.id === id), s = U.sheet, tg = target(ex.name);
      if (s.target === 'workout') { a.logs.push({ ex: ex.name, muscle: ex.muscle, sets: Array.from({ length: tg.sets }, () => ({ w: tg.weight || 0, r: tg.reps, done: false })) }); U.sheet = null; save(); render(); setTimeout(() => { const b = $('workout').querySelector('.scroll'); if (b) b.scrollTop = b.scrollHeight; }, 0); }
      else { const rt = S.routines.find(r => r.id === s.target); rt.items.push({ ex: ex.name, muscle: ex.muscle, sets: tg.sets, reps: tg.reps, weight: tg.weight || 0 }); U.sheet = { type: 'routine', id: rt.id }; save(); render(); toast(`Added ${ex.name}`); }
      break; }
    case 'close-sheet': U.sheet = null; renderSheet(); break;
    case 'close-sheet-bg': if (e.target === t) { U.sheet = null; renderSheet(); } break;
    case 'detail': U.sheet = { type: 'detail', id }; renderSheet(); break;
    case 'delete-workout': confirmDlg('Delete workout?', 'It will be removed from your history and charts.', 'Delete', true, () => { S.history = S.history.filter(h => h.id !== id); U.sheet = null; save(); render(); toast('Workout deleted'); }); break;
    case 'new-routine': U.sheet = { type: 'new-routine' }; renderSheet(); setTimeout(() => $('nr-name')?.focus(), 50); break;
    case 'save-routine': { const n = $('nr-name').value.trim(); if (!n) { const er = $('nr-err'); er.textContent = 'Give the routine a name.'; er.hidden = false; break; }
      const rt = { id: uid(), name: n, items: [], lastUsed: null }; S.routines.push(rt); save(); U.sheet = { type: 'picker', target: rt.id, q: '', m: null }; render(); break; }
    case 'routine': U.sheet = { type: 'routine', id }; renderSheet(); break;
    case 'rt-add': U.sheet = { type: 'picker', target: U.sheet.id, q: '', m: null }; renderSheet(); break;
    case 'rt-remove': { const rt = S.routines.find(r => r.id === U.sheet.id); rt.items.splice(+t.dataset.i, 1); save(); render(); break; }
    case 'delete-routine': { const rid = U.sheet.id; confirmDlg('Delete routine?', 'Past workouts are kept.', 'Delete', true, () => { S.routines = S.routines.filter(r => r.id !== rid); U.sheet = null; save(); render(); }); break; }
    case 'new-ex': U.sheet = { type: 'new-ex' }; renderSheet(); setTimeout(() => $('nx-name')?.focus(), 50); break;
    case 'save-ex': { const n = $('nx-name').value.trim(), er = $('nx-err');
      if (!n) { er.textContent = 'Give the exercise a name.'; er.hidden = false; break; }
      if (S.exercises.some(x => x.name.toLowerCase() === n.toLowerCase())) { er.textContent = `${n} is already in your library.`; er.hidden = false; break; }
      S.exercises.push({ id: uid(), name: n, muscle: $('nx-m').value, equip: $('nx-e').value, custom: true }); U.sheet = null; save(); render(); toast(`Added ${n}`); break; }
    case 'seg': U.libSeg = t.dataset.k; renderScreen(); break;
    case 'lib-muscle': U.libMuscle = t.dataset.m || null; renderScreen(); break;
    case 'pick-muscle': U.sheet.m = t.dataset.m || null; renderSheet(); break;
    case 'unit': S.unit = t.dataset.k; save(); render(); break;
    case 'reset': confirmDlg('Reset sample data?', 'Your changes in this prototype are replaced with the sample workouts.', 'Reset', true, () => { const ap = S.appearance; S = seed(); S.appearance = ap; U.rest = null; U.workoutOpen = false; U.exercise = null; save(); render(); toast('Sample data restored'); }); break;
    case 'clear': confirmDlg('Start with no data?', 'History and routines are cleared so you can try Volt from scratch. The exercise library stays.', 'Clear', true, () => { const fresh = seed(); S = { ...fresh, name: S.name, unit: S.unit, appearance: S.appearance, routines: [], history: [], sample: false }; U.rest = null; U.workoutOpen = false; U.exercise = null; save(); render(); }); break;
    case 'dlg-cancel': U.dialog = null; renderDialog(); break;
    case 'dlg-ok': { const fn = U.dialog.fn; U.dialog = null; renderDialog(); fn(); break; }
  }
});
$('device').addEventListener('input', e => {
  const t = e.target, k = t.dataset.input; if (!k) return;
  const a = S.active;
  if (k === 'g-email' || k === 'g-pw' || k === 'g-pw2') {
    U.gate[{ 'g-email': 'email', 'g-pw': 'pw', 'g-pw2': 'pw2' }[k]] = t.value; U.gate.err = '';
    const go = $('g-go'); if (go) go.disabled = !gateValid();
    return;
  }
  if (k === 'set-w') { const v = parseFloat(t.value.replace(',', '.')); a.logs[+t.dataset.li].sets[+t.dataset.si].w = isNaN(v) ? 0 : fromDisp(v); save(); }
  else if (k === 'set-r') { const v = parseInt(t.value, 10); a.logs[+t.dataset.li].sets[+t.dataset.si].r = isNaN(v) ? 0 : v; save(); }
  else if (k === 'w-title') { a.title = t.value; save(); }
  else if (k === 'name') { S.name = t.value; save(); const av = document.querySelector('.avatar'); if (av) av.textContent = (S.name || '?')[0].toUpperCase(); }
  else if (k === 'lib-search') { U.libSearch = t.value; $('lib-list').innerHTML = exRows(filterEx(U.libSearch, U.libMuscle), 'open-ex'); mountThumbs($('lib-list')); }
  else if (k === 'pick-search') { U.sheet.q = t.value; $('pick-list').innerHTML = exRows(filterEx(U.sheet.q, U.sheet.m), 'pick'); mountThumbs($('pick-list')); }
});
$('device').addEventListener('change', e => {
  if (e.target.dataset.change === 'trend') { U.trendEx = e.target.value; renderScreen(); }
  if (e.target.dataset.input === 'set-w' || e.target.dataset.input === 'set-r') renderWorkout();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (U.dialog) { U.dialog = null; renderDialog(); } else if (U.sheet) { U.sheet = null; renderSheet(); } else if (U.exercise) { U.exercise = null; renderExercise(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.appearance === 'auto') applyAppearance(); });

// ---------- Clock ----------
setInterval(() => {
  $('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' });
  if (S.active) document.querySelectorAll('[data-timer]').forEach(n => n.textContent = fmtDur((Date.now() - S.active.start) / 1000));
  if (U.rest) {
    const left = (U.rest.ends - Date.now()) / 1000;
    if (left <= 0) { U.rest = null; renderWorkout(); toast('Rest over · next set'); }
    else { const r = document.querySelector('[data-rest]'); if (r) r.textContent = fmtDur(left).replace(/^0/, ''); const b = document.querySelector('[data-rest-bar]'); if (b) b.style.width = Math.max(0, left / U.rest.total * 100) + '%'; }
  }
}, 1000);
$('clock').textContent = new Date().toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' });
render();
// Test hook (used by the automated checks)
window.__volt = { ANIMS, openExercise, state: () => S };
})();
</script>
